name: Offline regression tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -q -r requirements.txt
      - run: python -m compileall -q integrations modules tests authorize.py
      - run: python -m unittest discover -s tests -v
