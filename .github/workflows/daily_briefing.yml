name: "Abacus Handoff Pipeline & Automation"

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 07:00 Europe/Kyiv (Handoff Pipeline)
    - cron: "35 6 * * *"  # 06:35 UTC = 08:35 Europe/Kyiv (VAIT Post-Check)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abacus-handoff-persistence
  cancel-in-progress: false

jobs:
  handoff-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run Handoff Pipeline
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🚀 Abacus Handoff Pipeline — збір → дедуплікація → класифікація → Drive"
          python modules/daily_briefing/briefing.py --report "$RUNNER_TEMP/handoff_health.json"
          echo "✅ Handoff створено. Secretary обробить на стороні ChatGPT."

      - name: Upload sanitized health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-health-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff_health.json
          if-no-files-found: warn
          retention-days: 14

  vait-postcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.schedule == '35 6 * * *'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: VAIT Post-Briefing Control
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: python modules/daily_briefing/vait_postcheck.py

