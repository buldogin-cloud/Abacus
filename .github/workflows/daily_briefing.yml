name: "Abacus Handoff Pipeline & Automation"

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 07:00 Europe/Kyiv (Handoff Pipeline)
    - cron: "35 6 * * *"  # 06:35 UTC = 08:35 Europe/Kyiv (VAIT Post-Check)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-pipeline:
    runs-on: ubuntu-latest
    if: >-
      github.event.schedule == '0 4 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref != 'refs/heads/test/radar-google-integration')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run Handoff Pipeline
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🚀 Abacus Handoff Pipeline — збір → дедуплікація → класифікація → Drive"
          python modules/daily_briefing/briefing.py
          echo "✅ Handoff створено. Secretary обробить на стороні ChatGPT."

      - name: Archive Logs (Optional)
        run: |
          git config user.email "abacus@github.local"
          git config user.name "Abacus Agent"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore: handoff pipeline logs $(date +'%Y-%m-%d')" || true
          git push || echo "No changes to push"

  vait-postcheck:
    runs-on: ubuntu-latest
    if: github.event.schedule == '35 6 * * *'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: VAIT Post-Briefing Control
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: python modules/daily_briefing/vait_postcheck.py

      - name: Commit & Push
        run: |
          git config user.email "abacus@github.local"
          git config user.name "Abacus Agent"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore: vait-postcheck $(date +'%Y-%m-%d')"
          git push || echo "Nothing to push"

  radar-google-integration:
    name: Isolated radar Google integration
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/test/radar-google-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact test ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail-closed scope preflight
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/test/radar-google-integration"
          test -n "${GOOGLE_TOKEN:-}"
          test -z "${GOOGLE_CREDENTIALS:-}"
          test -z "${TELEGRAM_BOT_TOKEN:-}"
          test -z "${TELEGRAM_CHAT_ID:-}"
          test -z "${GMAIL_APP_PASSWORD:-}"
          approved="08df0ba05cb61c657b6b457f72a84564e38773fd"
          git merge-base --is-ancestor "$approved" HEAD
          actual="$(git diff --name-only "$approved"..HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/daily_briefing.yml' \
            'tests/manual_google_radar_integration.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Static validation
        run: |
          python -m py_compile tests/manual_google_radar_integration.py
          python -m unittest discover -s tests -v
          python tests/manual_google_radar_integration.py

      - name: Run isolated integration once
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          PYTHONWARNINGS: ignore
        run: python tests/manual_google_radar_integration.py --execute
