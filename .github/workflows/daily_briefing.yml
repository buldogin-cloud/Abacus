name: Щоденний брифінг Command Center

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4
      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Встановлення залежностей
        run: pip install -r requirements.txt
      - name: Підготовка облікових даних
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json
          printf '%s' "$GOOGLE_TOKEN" > token.json
      - name: Формування брифінгу
        run: python modules/daily_briefing/briefing.py
      - name: Збереження артефакту
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing
          path: briefings/*.md
          retention-days: 30
