# ============================================================
# Приклад конфігурації Command Center
# Скопіюйте цей файл у корінь проекту як config.yaml та заповніть.
# УВАГА: config.yaml НЕ потрапляє у git (див. .gitignore).
# ============================================================

# --- Загальні налаштування ---
general:
  # Мова брифінгу (наразі підтримується українська).
  language: "uk"
  # Часовий пояс для відображення дат.
  timezone: "Europe/Kyiv"
  # Директорія, куди зберігати згенеровані брифінги.
  output_dir: "briefings"

# --- Gmail ---
gmail:
  # За скільки останніх днів збирати листи для брифінгу.
  lookback_days: 1
  # Максимальна кількість листів кожного типу у брифінгу.
  max_messages: 15

# --- Google Calendar ---
calendar:
  # ID календаря ("primary" — основний календар користувача).
  calendar_id: "primary"
  # На скільки днів наперед показувати події (2 = сьогодні + завтра).
  upcoming_days: 2

# --- Google Sheets (реєстр завдань) ---
tasks:
  # ID таблиці Google Sheets із завданнями (з URL таблиці).
  spreadsheet_id: "ВАШ_SPREADSHEET_ID"
  # Назва аркуша із завданнями.
  sheet_name: "Завдання"

# --- Дослідник (моніторинг джерел) ---
researcher:
  # Чи додавати дайджест Дослідника у брифінг.
  enabled: true
  # Ключові слова для фільтрації новин МОЗ / НСЗУ.
  keywords:
    - "анестезіолог"
    - "інтенсивна терапія"
    - "закупівл"
    - "стандарт"
    - "наказ"
    - "протокол"
  # Скільки записів на джерело показувати.
  limit_per_source: 5

# --- Надсилання брифінгу (необовʼязково) ---
delivery:
  # Надіслати брифінг на пошту (через Gmail API).
  send_email: false
  # Адреса отримувача брифінгу.
  email_to: "your.email@example.com"
