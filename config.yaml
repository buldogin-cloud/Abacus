# ============================================================
# Конфігурація Command Center
# УВАГА: Цей файл НЕ потрапляє у git (див. .gitignore).
# ============================================================

# --- Загальні налаштування ---
general:
  # Мова брифінгу
  language: "uk"
  # Часовий пояс
  timezone: "Europe/Kyiv"
  # Директорія для брифінгів
  output_dir: "briefings"

# --- Gmail ---
gmail:
  # За скільки останніх днів збирати листи
  lookback_days: 1
  # Максимальна кількість листів кожного типу
  max_messages: 15

# --- Google Calendar ---
calendar:
  # ID календаря ("primary" — основний)
  calendar_id: "primary"
  # На скільки днів наперед показувати події
  upcoming_days: 2

# --- Google Sheets (реєстр завдань) ---
tasks:
  # ID таблиці Google Sheets
  spreadsheet_id: "11oqxqRm7cAH6jpKf9T7CYtIY0j01LAV259F7NGkd5so"
  # Назва аркуша із завданнями
  sheet_name: "Реєстр"

# --- Дослідник (моніторинг джерел) ---
researcher:
  # Чи додавати дайджест у брифінг
  enabled: true
  # Ключові слова для фільтрації
  keywords:
    - "анестезіолог"
    - "анестезіологія"
    - "інтенсивна терапія"
    - "реанімація"
    - "закупівл"
    - "стандарт"
    - "наказ"
    - "протокол"
    - "ВОКЛ"
    - "медобладнання"
  # Скільки записів на джерело
  limit_per_source: 5

# --- Надсилання брифінгу ---
delivery:
  # Надіслати у Telegram (true/false)
  send_telegram: true
  # email вимкнено — замінено на Telegram
  send_email: false
